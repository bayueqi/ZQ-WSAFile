name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" || true

      - name: Prepare wrapper
        run: |
          ls -l gradlew
          chmod +x ./gradlew

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee build-output.log

      - name: Collect APK
        if: success()
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/ZQ-WSAFile-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ZQ-WSAFile-debug
          path: out/ZQ-WSAFile-debug.apk
          if-no-files-found: error

      - name: Publish build log on failure
        if: failure()
        run: |
          {
            echo "===== environment ====="
            java -version 2>&1 || true
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            which sdkmanager || true
            ls "$ANDROID_HOME/platforms" 2>&1 || true
            ls -l gradlew 2>&1 || true
            echo "===== build output ====="
            if [ -f build-output.log ]; then
              tail -n 500 build-output.log
            else
              echo "no build output captured"
            fi
          } > build-log.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f build-log.txt
          git commit -m "ci: capture build log [skip ci]" || exit 0
          git push || exit 0
